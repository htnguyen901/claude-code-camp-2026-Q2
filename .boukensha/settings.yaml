session:
  self_manage: true      # keep going after a Judge checkpoint instead of waiting for you to type "continue"
  max_cost_usd: 5.00      # hard spend cap across the whole session (Player + Planner + Judge + Navigator combined)
  cost_warn_pct: 0.85     # optional, defaults to 0.85 — fraction of max_cost_usd that triggers one wind-down turn before stopping

# Per-player, cross-session memory (docs/plans/memory/player_memory.md) —
# Session.play only, gated by both memory.enabled and a --player being set.
# Defaults off: an LLM-authored digest that's wrong can steer a future
# session's plan in the wrong direction, so this stays opt-in until a few
# real sessions' digests have been read and look sane.
memory:
  enabled: true
  # dir: memory   # relative to .boukensha/, default shown

# Named, reusable tool-name glob sets — see docs/plans/tools_policy/
# permission.md. A task with no tasks.<name>.tools block at all gets zero
# tools (deny-by-default, Boukensha::Tasks::Base.tool_policy).
#
# `full: ["*"]` is kept only as a manual debugging escape hatch (temporarily
# point a task's `tools:` at it to see every tool any configured mcp_servers
# entry advertises) — no task is assigned it by default any more. It grants
# account-management tools (tbamud__create_character/delete_character) and,
# whenever the optional `filesystem:` server is up, every fs__* file/
# directory tool too — none of which any current task should have.
#
# Roles for the Planner/Player/Judge agentic loop (docs/plans/agent_loop/
# orchestrator.md, worker.md, evaluator.md):
#   player   -> gameplay    every tbamud__* MUD command except the two
#               account-management ones (create_character/delete_character —
#               a playing character has no legitimate reason to create or
#               delete a character mid-session), and explicitly nothing
#               outside tbamud__* — no fs__* file/directory tools, even if
#               the optional `filesystem:` server below is running.
#   planner  -> world_knowledge + consult_navigator, see tasks.planner
#               below. Fact lookups (world__room_knowledge) plus delegated
#               path-finding, not live look/examine over the Player's MUD
#               connection — observing is the Player's job. Omitting
#               `tools:` entirely (as this block used to) is equally valid
#               and denies everything by default, per Tasks::Base.tool_policy;
#               nothing in code special-cases "planner" to force that, so
#               whatever role is granted here is what it actually gets, same
#               as any task.
#   judge    -> world_knowledge + consult_navigator   overall mentor, not a
#               gameplay coach: keeps the Player honest against the Plan.
#               Fact-checks via world__room_knowledge directly and delegates
#               path reasoning to consult_navigator, but never
#               look/examine/shop/consume/consider/diagnose (that's the
#               Player's responsibility) and never move/attack/quit/give.
#   navigator -> navigator  Tasks::Navigator (docs/plans/agent_loop/
#               navigator.md): world__room_knowledge/route_to only, no
#               tbamud__move and no tbamud__look — it answers whether a path
#               exists, it doesn't walk it. Read-only, so it's safe to hand
#               `consult_navigator` to Judge and Planner as well as Player.
tool_roles:
  full: ["*"]
  gameplay: ["tbamud__*"]
  navigator: [world__room_knowledge, world__route_to]
  world_knowledge: [world__room_knowledge]

tasks:
  planner:
    provider: openai
    enabled: true
    model: gpt-5.5
    max_output_tokens: 512
    tools:
      role: world_knowledge
      allow: [consult_navigator]
  judge:
    provider: openai
    model: gpt-5.5
    max_output_tokens: 400
    max_iterations: 5
    tools:
      role: world_knowledge
      allow: [consult_navigator]
  player:
    provider: openai
    model: gpt-5.4-mini
    prompt_override:
      system: true
    tools:
      role: gameplay
      allow: [consult_navigator]
      # create_character/delete_character: account management, not something
      # a playing character has a reason to do mid-session.
      # connect/disconnect: take an arbitrary name+password from the LLM —
      # the one thing standing between a stuck session and the agent
      # inventing credentials and logging in as a fabricated character (see
      # docs/journal/3_capable.md's "logged in as boukensha" incident).
      # tbamud__reconnect (env-credential-only, no name/password params) and
      # tbamud__account_menu (answers the in-game "Make your choice:" menu
      # without dropping the connection) cover the same recovery need
      # safely and stay allowed via the `gameplay` role's tbamud__* wildcard.
      deny: [tbamud__create_character, tbamud__delete_character, tbamud__connect, tbamud__disconnect]
  navigator:
    provider: openai
    model: gpt-5.4-mini
    max_output_tokens: 300
    max_iterations: 4
    tools:
      role: navigator
  chronicler:
    provider: openai
    model: gpt-5.5      # cheap/fast — one reflective rewrite, not open-ended play
    max_output_tokens: 2000
  content_fact:
    enabled: true
    provider: ollama
    model: gemma4
    # host: http://localhost:11434
  compactor:
    enabled: true
    provider: ollama
    model: gemma4
    # host: http://localhost:11434
    min_chars: 150

# OpenTelemetry traces/metrics (Boukensha::Telemetry, week2_observability/
# ruby/15_observability). Defaults on — it's inert instrumentation and
# fail-open (no collector running just means it's dropped), unlike
# tasks.compactor above which defaults off because Tier 2 is a real behavior
# change. Set to false for zero SDK overhead instead of "exports nowhere".
# Everything else (endpoint, service name, exporter choice) is standard OTel
# env vars — see the step's README — not settings.yaml.
# observability:
#   enabled: false


mcp_servers:
  mud:
    command: mud-manager
    args:    [--mcp]
    prefix:  tbamud          # the daemon's `look` reaches the agent as tbamud__look
    env:
      MUD_HOST:     localhost
      MUD_PORT:     4000
      MUD_NAME:
      MUD_PASSWORD:

  filesystem:
    command:  npx
    args:     [-y, "@modelcontextprotocol/server-filesystem", /tmp]
    prefix:   fs
    required: false

  # mcp for world tools
  log-viz:
    command: log_viz
    args:    [--mcp]
    prefix:  world          # room_knowledge reaches the agent as world__room_knowledge
    env:
      WORLD_MAP_PLAYER: