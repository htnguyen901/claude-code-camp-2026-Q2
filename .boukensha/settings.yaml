# Named, reusable tool-name glob sets — see docs/plans/tools_policy/
# permission.md. A task with no tasks.<name>.tools block at all gets zero
# tools (deny-by-default, Boukensha::Tasks::Base.tool_policy).
#
# `full: ["*"]` is kept only as a manual debugging escape hatch (temporarily
# point a task's `tools:` at it to see every tool any configured mcp_servers
# entry advertises) — no task is assigned it by default any more. It grants
# account-management tools (tbamud__create_character/delete_character) and,
# whenever the optional `filesystem:` server is up, every fs__* file/
# directory tool too — none of which any current task should have.
#
# Roles for the Planner/Player/Judge agentic loop (docs/plans/agent_loop/
# orchestrator.md, worker.md, evaluator.md):
#   player   -> gameplay    every tbamud__* MUD command except the two
#               account-management ones (create_character/delete_character —
#               a playing character has no legitimate reason to create or
#               delete a character mid-session), and explicitly nothing
#               outside tbamud__* — no fs__* file/directory tools, even if
#               the optional `filesystem:` server below is running.
#   planner  -> world_knowledge + consult_navigator, see tasks.planner
#               below. Fact lookups (world__room_knowledge) plus delegated
#               path-finding, not live look/examine over the Player's MUD
#               connection — observing is the Player's job. Omitting
#               `tools:` entirely (as this block used to) is equally valid
#               and denies everything by default, per Tasks::Base.tool_policy;
#               nothing in code special-cases "planner" to force that, so
#               whatever role is granted here is what it actually gets, same
#               as any task.
#   judge    -> world_knowledge + consult_navigator   overall mentor, not a
#               gameplay coach: keeps the Player honest against the Plan.
#               Fact-checks via world__room_knowledge directly and delegates
#               path reasoning to consult_navigator, but never
#               look/examine/shop/consume/consider/diagnose (that's the
#               Player's responsibility) and never move/attack/quit/give.
#   navigator -> navigator  Tasks::Navigator (docs/plans/agent_loop/
#               navigator.md): world__room_knowledge/route_to only, no
#               tbamud__move and no tbamud__look — it answers whether a path
#               exists, it doesn't walk it. Read-only, so it's safe to hand
#               `consult_navigator` to Judge and Planner as well as Player.
tool_roles:
  full: ["*"]
  gameplay: ["tbamud__*"]
  # tbamud__move removed — Navigator never acts, it only answers "is there a
  # known path, and what is it?" (docs/plans/agent_loop/agents_tools/
  # tool_scope_rework.md §0).
  navigator: [world__room_knowledge, world__route_to]
  # Direct grant for tasks that need room facts but not path-finding (Judge,
  # Planner). Path-finding for both goes through consult_navigator instead
  # of a direct world__route_to grant — see tasks.judge/tasks.planner below.
  world_knowledge: [world__room_knowledge]

tasks:
  # Tasks::Planner — reasons over the goal (and, on a replan, the prior
  # plan + Player transcript tail). `tools:` here works exactly like it
  # does for judge/player below — Boukensha.run_planner reads it through
  # Tasks::Base.tool_policy and reuses the Player's already-connected Tool
  # objects (see reuse_registered_tools in lib/boukensha.rb), so `role:
  # world_knowledge` + `allow: [consult_navigator]` really does let it check
  # room facts and delegate path-finding while planning, without live
  # look/examine tools over the Player's own MUD connection. Delete this
  # `tools:` block entirely if you want the Planner back to pure reasoning
  # with zero tools — that's still the default when it's omitted, just no
  # longer the only option. See orchestrator.md §3 and
  # docs/plans/agent_loop/agents_tools/tool_scope_rework.md §2.
  planner:
    provider: openai
    enabled: true
    model: gpt-5.5
    max_output_tokens: 512
    tools:
      role: world_knowledge
      allow: [consult_navigator]
  # Tasks::Judge — read-only overall mentor, not a gameplay coach
  # (docs/plans/agent_loop/evaluator.md, tool_scope_rework.md §0/§2).
  # role: world_knowledge grants world__room_knowledge directly for
  # fact-checking the transcript; consult_navigator delegates path-specific
  # reasoning instead of a direct world__route_to grant. Registry silently
  # drops anything it denies, so this is the only place
  # look/examine/shop/consume/consider/diagnose/move/attack/quit/give need
  # to be kept out of the Judge's reach. max_iterations is deliberately
  # small ("check a couple of facts, then decide" —
  # Tasks::Judge::DEFAULT_MAX_ITERATIONS falls back to 5 even if this key is
  # omitted).
  judge:
    provider: openai
    model: gpt-5.5
    max_output_tokens: 400
    max_iterations: 5
    tools:
      role: world_knowledge
      allow: [consult_navigator]
  player:
    provider: openai
    model: gpt-5.4-mini
    prompt_override:
      system: true
    tools:
      role: gameplay
      allow: [consult_navigator]
      deny: [tbamud__create_character, tbamud__delete_character]
  # Tasks::Navigator — docs/plans/agent_loop/navigator.md, reworked by
  # tool_scope_rework.md §0/§3/§4 into a read-only route *finder*, not a
  # route *executor* — it answers "is there a known path, and what is it?"
  # and returns a short description; it never moves anyone. Callable as a
  # tool (consult_navigator, registered above via `allow:`) by Player,
  # Judge, and Planner alike, not a background per-turn call like
  # planner/judge above — it only runs when a caller actually asks for it.
  # max_iterations is small — a handful of world__route_to/
  # world__room_knowledge calls to answer one question, not "issue N moves,
  # then stop" (Tasks::Navigator::DEFAULT_MAX_ITERATIONS falls back to 4
  # even if this key is omitted).
  navigator:
    provider: openai
    model: gpt-5.4-mini
    max_output_tokens: 300
    max_iterations: 4
    tools:
      role: navigator
  # log_viz's background content-classification subtask (ContentFact —
  # docs/plans/observability/room_world_inspector.md §1), read by
  # LogViz::Settings, NOT by the boukensha gem — log_viz is a separate Ruby
  # program that just happens to read this same file. Same "task" shape as
  # `player` above (provider/model), so it's configured the same way.
  #
  # Only `provider: ollama` is actually implemented today — a different
  # value here is accepted (won't raise) but falls back to ollama with a
  # warning, since this is a best-effort background feature, not something
  # that should block log_viz from starting. `host` is optional; the
  # `OLLAMA_HOST` env var still overrides it if set (useful when log_viz
  # and Ollama don't share a network namespace, e.g. cross-VM/WSL setups).
  content_fact:
    enabled: true
    provider: ollama
    model: gemma4
    # host: http://localhost:11434

  # boukensha's own MUD tool-result compactor (see
  # docs/plans/token_optimization/mud_response_compaction.md). Tiers 0/1 —
  # ANSI/prompt-noise stripping and structure-aware trim, keeping room
  # title/exits/contents verbatim — always run, no config needed. `enabled`
  # here gates only Tier 2, the opt-in LLM prose rewrite; left off until
  # its eval (task completion / next-action correctness) confirms it's safe
  # to default on.
  compactor:
    enabled: true
    provider: ollama
    model: gemma4
    # host: http://localhost:11434
    min_chars: 150

# OpenTelemetry traces/metrics (Boukensha::Telemetry, week2_observability/
# ruby/15_observability). Defaults on — it's inert instrumentation and
# fail-open (no collector running just means it's dropped), unlike
# tasks.compactor above which defaults off because Tier 2 is a real behavior
# change. Set to false for zero SDK overhead instead of "exports nowhere".
# Everything else (endpoint, service name, exporter choice) is standard OTel
# env vars — see the step's README — not settings.yaml.
# observability:
#   enabled: false

# mud:
#   host: localhost
#   port: 4000
#   username: dummy
#   password: helloworld

mcp_servers:
  # The MUD. `mud` is not special to boukensha any more — it's just the server
  # that happens to know telnet and the login dance. Credentials travel by
  # environment because that is what the stdio transport gives you; the LLM
  # never sees them, and the session lives in the daemon.
  #
  # `command`/`args` are resolved by the OS against the shell's cwd — NOT
  # against boukensha_dir/boukensha_path from ~/.boukensharc, and boukensha
  # never chdirs for you. A relative path here only works when you happen to
  # launch from the repo root. Nothing hunts for the binary on your behalf any
  # more — that discovery logic died with Tools::McpMud, which is the trade
  # for the agent not knowing what a MUD is. `mud-manager` is installed on
  # PATH (the mud_manager gem), so we call it directly instead.
  # This entry is `required` (the default), so a bad path fails loudly at boot.
  #
  # MUD_NAME/MUD_PASSWORD are intentionally blank — a static default
  # character here is exactly what made running two players at once
  # impossible (docs/plans/observability/players/
  # multiple_concurrent_players.md). Run `boukensha --player NAME` to log in
  # as one of .boukensha/players/*.yaml; Boukensha.overlay_player_credentials
  # fills these two keys in at boot from that profile. The keys stay present
  # (empty) rather than being deleted outright because the overlay only ever
  # mutates a key that's already declared here — never invents a new one.
  # Omitting --player now prints a notice and runs with no MUD identity,
  # which will fail to log in rather than silently reusing a shared default.
  mud:
    command: mud-manager
    args:    [--mcp]
    prefix:  tbamud          # the daemon's `look` reaches the agent as tbamud__look
    env:
      MUD_HOST:     localhost
      MUD_PORT:     4000
      MUD_NAME:
      MUD_PASSWORD:

  filesystem:
    command:  npx
    args:     [-y, "@modelcontextprotocol/server-filesystem", /tmp]
    prefix:   fs
    required: false

  # world_knowledge.md: room_knowledge/route_to, hosted by log_viz (which
  # already owns world_map.sqlite3 and its WorldMap query logic) instead of
  # being a boukensha-side hand-written tool that duplicated log_viz's own
  # SQL. `log_viz` must be on PATH (`gem build log_viz.gemspec && gem
  # install ./log_viz-*.gem` from week3_capable/log_viz, the same one-time
  # per-machine step `mud-manager` already needs — see that gem's README).
  #
  # WORLD_MAP_PLAYER is intentionally blank, same posture as mud.env's
  # MUD_NAME/MUD_PASSWORD above: Boukensha.overlay_player_credentials fills
  # it in at boot from `boukensha --player NAME`'s profile. Omitting
  # --player runs world__room_knowledge/world__route_to in their historical
  # un-scoped (whole-map) mode, not an error.
  log-viz:
    command: log_viz
    args:    [--mcp]
    prefix:  world          # room_knowledge reaches the agent as world__room_knowledge
    env:
      WORLD_MAP_PLAYER:

# log_viz / world__room_knowledge (docs/plans/observability/
# room_world_inspector.md, docs/plans/world_knowledge/world_knowledge.md)
# — provider/model/host for the content-fact subtask now live in
# `tasks.content_fact` above. What's left is still environment-only, since
# it's per-machine path/network config rather than a "task" setting:
#
#   LOG_VIZ_WORLD_MAP_DB  default: <repo root>/.boukensha/world_map.sqlite3
#     SQLite file log_viz's WorldMap reads/writes, and the same file
#     `log_viz --mcp` (mcp_servers.log-viz above) opens read-only for
#     world__room_knowledge/world__route_to.
#   LOG_VIZ_SESSIONS_DIR  default: <repo root>/.boukensha/sessions
#   OLLAMA_HOST           default: http://localhost:11434 (or tasks.content_fact.host above)
#     Must be reachable from wherever log_viz runs, which may not be the
#     same host/container the agent's own Ollama backend (backends/
#     ollama.rb) hits — e.g. Ollama running natively in WSL (this repo's
#     dev setup) needs no override; Ollama on the Windows host instead of
#     inside WSL would need this pointed at the Windows-side address.
#     Unreachable is a soft failure (kind: "unknown"), never blocks
#     ingestion.